<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>晨光咖啡首页视觉稿</title>
<style>
:root{
  --bg:#f3efe6;
  --paper:#fffdf8;
  --ink:#1c1917;
  --muted:#7a7268;
  --line:#e6dfd3;
  --accent:#0f766e;
  --accent-ink:#0b4f49;
  --soft:#d9f3ee;
  --ok:#15803d;
  --warn:#b45309;
  --bad:#b91c1c;
  --pin:#c2410c;
  --shadow:0 12px 40px rgba(28,25,23,.08);
  --font:"PingFang SC","Hiragino Sans GB","Noto Sans SC",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font)}
button,input,textarea,select{font:inherit}
a{color:var(--accent-ink)}
.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(255,253,248,.86);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
.top h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent-ink);border:1px solid #b7e6dd}
.back{color:var(--muted);text-decoration:none;font-size:13px}
.back:hover{color:var(--ink)}
.stage{display:grid;grid-template-columns:1fr 360px;min-height:0}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
.experience{padding:28px 32px;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center}
.hint{color:var(--muted);font-size:13px;text-align:center;max-width:420px}
.panel{background:var(--paper);border-left:1px solid var(--line);padding:20px 18px 28px;display:flex;flex-direction:column;gap:14px;overflow:auto}
@media (max-width:900px){.panel{border-left:none;border-top:1px solid var(--line)}}
.panel h2{margin:0;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted)}
.choices{display:flex;gap:6px;flex-wrap:wrap}
.choice{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.choice[aria-pressed="true"][data-v="通过"]{background:#dcfce7;border-color:#86efac;color:var(--ok)}
.choice[aria-pressed="true"][data-v="需修改"]{background:#ffedd5;border-color:#fdba74;color:var(--warn)}
.choice[aria-pressed="true"][data-v="不通过"]{background:#fee2e2;border-color:#fca5a5;color:var(--bad)}
textarea,input[type="text"],input[type="file"]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;width:100%}
textarea{min-height:72px;resize:vertical}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;display:flex;flex-direction:column;gap:6px}
.item header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.item button.icon{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 6px}
.primary{appearance:none;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.primary:hover{filter:brightness(1.05)}
.files{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


.phone{width:320px;height:640px;background:#1c1917;border-radius:36px;padding:10px;box-shadow:var(--shadow);position:relative}
.screen{height:100%;background:#faf7f2;border-radius:28px;overflow:hidden;position:relative;cursor:crosshair}
.bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;font-size:11px;color:#57534e}
.nav{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 10px}
.nav h3{margin:0;font-size:20px}
.chiprow{display:flex;gap:6px;padding:0 16px 12px}
.chip{font-size:11px;padding:4px 8px;border-radius:999px;background:#efe8dc;color:#44403c}
.chip.on{background:#1c1917;color:#fff}
.hero-card{margin:0 16px;border-radius:18px;height:180px;background:linear-gradient(160deg,#f59e0b,#b45309 60%,#7c2d12);color:#fff;padding:18px 16px;display:flex;flex-direction:column;justify-content:flex-end}
.hero-card small{opacity:.85}
.hero-card h4{margin:4px 0 0;font-size:22px;letter-spacing:-.02em}
.listc{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.thumb{width:44px;height:44px;border-radius:12px}
.t1{background:linear-gradient(135deg,#fed7aa,#c2410c)}
.t2{background:linear-gradient(135deg,#e9d5ff,#6d28d9)}
.t3{background:linear-gradient(135deg,#bbf7d0,#15803d)}
.row .meta{flex:1}
.row .meta b{display:block;font-size:13px}
.row .meta span{font-size:11px;color:#78716c}
.price{font-size:13px;font-weight:650}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:56px;background:#fff;border-top:1px solid #efe8dc;display:flex;align-items:center;justify-content:space-around;font-size:11px;color:#78716c}
.tabbar span.on{color:#1c1917;font-weight:650}
.pin{position:absolute;width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--pin);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-100%) rotate(-45deg);box-shadow:0 4px 10px rgba(194,65,12,.35);z-index:2;cursor:pointer}
.pin span{transform:rotate(45deg)}
.pin.active{background:#1c1917;z-index:3}
</style>
<body>
<div class="app">
  <header class="top">
    <a class="back" href="../index.html">全部示例</a>
    <h1>晨光咖啡首页视觉稿</h1>
    <span class="badge">scene: visual</span>
  </header>
  <div class="stage">
<section class="experience">
  <div class="phone">
    <div class="screen" id="canvas" title="点击画面打点标注">
      <div class="bar"><span>9:41</span><span>晨光咖啡</span></div>
      <div class="nav"><h3>发现</h3><span>上海 · 静安</span></div>
      <div class="chiprow"><span class="chip on">精选</span><span class="chip">拿铁</span><span class="chip">手冲</span><span class="chip">甜品</span></div>
      <div class="hero-card"><small>今日精选</small><h4>燕麦Dirty</h4><small>埃塞俄比亚日晒豆 · 16 元</small></div>
      <div class="listc">
        <div class="row"><div class="thumb t1"></div><div class="meta"><b>桂花酿拿铁</b><span>热 / 冰</span></div><div class="price">28</div></div>
        <div class="row"><div class="thumb t2"></div><div class="meta"><b>瑰夏手冲</b><span>浅烘 · 单品</span></div><div class="price">48</div></div>
        <div class="row"><div class="thumb t3"></div><div class="meta"><b>抹茶巴斯克</b><span>当日限量</span></div><div class="price">32</div></div>
      </div>
      <div class="tabbar"><span class="on">发现</span><span>菜单</span><span>门店</span><span>我的</span></div>
    </div>
  </div>
  <p class="hint">在视觉稿上点击打点，选中图钉后填写意见。可标注多处。</p>
</section>
<aside class="panel">
  <h2>验收反馈</h2>
  <div class="field"><label>结论</label><div class="choices" id="verdict"></div></div>
  <div class="field"><label>标注</label><div class="list" id="regions"><div class="files">还没有标注，点击左侧画面添加。</div></div></div>
  <div class="field"><label>总评</label><textarea id="note" placeholder="整体气质、留白、信息层级…"></textarea></div>
  <div class="field"><label>截图 / 附件</label><input id="files" type="file" accept="image/*,video/*,*/*" multiple></div>
  <button class="primary" id="copy" type="button">复制反馈</button>
</aside>
</div>
</div>
<script>

function toast(msg){
  let el=document.querySelector('.toast');
  if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);
}
function choiceGroup(root, values, initial){
  root.innerHTML='';
  let current=initial||null;
  values.forEach(v=>{
    const b=document.createElement('button');
    b.type='button';b.className='choice';b.dataset.v=v;b.textContent=v;
    b.setAttribute('aria-pressed', String(v===current));
    b.addEventListener('click',()=>{current=v;[...root.children].forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===current)))});
    root.appendChild(b);
  });
  return ()=>current;
}
function fileList(input){return input&&input.files?Array.from(input.files):[]}
function downloadText(name,text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
async function submitFeedback(payload, files){
  const bridge=window.__grokbotXPreview;
  if(bridge&&bridge.submitFeedback){
    await bridge.submitFeedback({json:payload,files:files||[]});
    toast('已交给 grokbot-x，请粘贴回对话');
    return;
  }
  const text=JSON.stringify(payload,null,2);
  try{
    await navigator.clipboard.writeText(text);
    toast(files&&files.length?'已复制 JSON（无扩展降级，附件请自行附上）':'已复制反馈 JSON');
  }catch{
    downloadText('feedback.json',text);
    toast('已下载 feedback.json');
  }
}


const getVerdict=choiceGroup(document.getElementById('verdict'),['通过','需修改','不通过']);
const canvas=document.getElementById('canvas');
const regionsEl=document.getElementById('regions');
let regions=[];
let selected=null;
function renderPins(){
  canvas.querySelectorAll('.pin').forEach(p=>p.remove());
  regions.forEach((r,i)=>{
    const el=document.createElement('div');
    el.className='pin'+(selected===i?' active':'');
    el.style.left=(r.x*100)+'%';el.style.top=(r.y*100)+'%';
    el.innerHTML='<span>'+(i+1)+'</span>';
    el.addEventListener('click',ev=>{ev.stopPropagation();selected=i;render();});
    canvas.appendChild(el);
  });
}
function renderList(){
  if(!regions.length){regionsEl.innerHTML='<div class="files">还没有标注，点击左侧画面添加。</div>';return;}
  regionsEl.innerHTML='';
  regions.forEach((r,i)=>{
    const item=document.createElement('div');item.className='item';
    item.innerHTML=`<header><span>#${i+1} · ${(r.x*100).toFixed(0)}%, ${(r.y*100).toFixed(0)}%</span><button class="icon" type="button" data-del="${i}">删除</button></header>
      <input type="text" placeholder="这里有什么问题？" value="${r.comment.replace(/"/g,'&quot;')}" data-i="${i}">`;
    regionsEl.appendChild(item);
  });
  regionsEl.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input',()=>{regions[+inp.dataset.i].comment=inp.value;});
    inp.addEventListener('focus',()=>{selected=+inp.dataset.i;renderPins();});
  });
  regionsEl.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    regions.splice(+b.dataset.del,1);selected=null;render();
  }));
}
function render(){renderPins();renderList();}
canvas.addEventListener('click',ev=>{
  if(ev.target.closest('.pin'))return;
  const rect=canvas.getBoundingClientRect();
  const x=(ev.clientX-rect.left)/rect.width;
  const y=(ev.clientY-rect.top)/rect.height;
  regions.push({image:'home.png',x:+x.toFixed(3),y:+y.toFixed(3),comment:''});
  selected=regions.length-1;render();
  regionsEl.querySelector(`input[data-i="${selected}"]`)?.focus();
});
document.getElementById('copy').addEventListener('click',()=>{
  const verdict=getVerdict();
  if(!verdict){toast('请先选一个结论');return;}
  submitFeedback({
    title:'晨光咖啡首页视觉稿验收',
    scene:'visual',
    verdict,
    regions:regions.map((r,i)=>({...r,index:i+1})),
    note:document.getElementById('note').value.trim()
  }, fileList(document.getElementById('files')));
});
render();

</script>
</body>
</html>
